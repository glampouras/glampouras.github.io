cv:
  name: Gerasimos (Makis) Lampouras
  label: Chief Scientific Officer, C Proof
  email: gerasimos.lampouras@gmail.com
  location: London, UK
  summary: Gerasimos (Makis) Lampouras is the Chief Scientific Officer at C Proof, London. Prior to this, he was a Principal Research Scientist and served as the Team Leader of the NLP (Natural Language Processing) group in Huawei Noah’s Ark Lab, London. <br><br> Areas of interest generally fall somewhere between Natural Language Processing and Machine Learning, with his latest efforts focusing on the information seeking and synthesis capabilities of LLM-based Agents and on neuro-symbolic approaches for math and code reasoning. Briefly, his previous work has focused on LLM-based code synthesis and understanding, Natural Language Generation, Dialogue Systems, and overall Machine Learning applications for Natural Language Processing. <br><br> Formerly, he was a Research Associate at the University of Cambridge, University of Sheffield and University College London. He graduated and received his MSc and PhD from the Athens University of Economics and Business.

  sections:
    General Information:
      - label: Date of Birth
        details: 15th June 1984
      - label: Languages
        details: English, Greek

    Experience:
      - position: Chief Scientific Officer
        company: <a href=https://cproof.ai/>C Proof</a>
        location: London, UK
        start_date: 2026
        highlights:
          - Leading research on automatic verification for code agents, building the runtime (<a href="https://chelis.ch/">Chelis</a>) that ensures AI-generated code is correct and safe prior to execution. Spearheading technical strategy and domain applications, starting with quantitative finance (<a href="https://cproof.ai/c-note">C Note</a>).

      - position: Team Leader of the London NLP Team
        company: Huawei Technologies Research & Development (UK) Ltd
        location: London, UK
        start_date: 2024
        end_date: 2026
        highlights:
          - Leading a group of ~10 Senior Research Scientists and Engineers researching how to address current NLP and Large Language Models challenges, e.g. how to improve LLM's reasoning capabilities, LLM self-learning, LLM efficiency, LLMs for Programming Languages and Math, as well as related tasks.

      - position: Principal Research Scientist in NLP
        company: Huawei Technologies Research & Development (UK) Ltd
        location: London, UK
        start_date: 2023
        end_date: 2026
        highlights:
