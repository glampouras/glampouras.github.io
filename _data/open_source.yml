# Projects listed on the "open source code" page (_pages/open-source.md), newest first.
# Each project: title, venue, description, optional repo label, links (label/url/icon) and papers (label/arxiv).
# A project may also have subprojects (same fields), shown as subcards.
# Icons: fa-solid fa-globe (website), fa-brands fa-github (code), fa-solid fa-database (dataset),
#        fa-solid fa-trophy (leaderboard), fa-solid fa-toolbox (tool)

- title: DeepSynth
  venue: ICLR 2026
  description: A benchmark of 120 real-world tasks testing whether AI agents can gather, combine, and reason over information from multiple sources.
  links:
    - label: Website
      url: https://agentdeepsynthesis.github.io/deepsynth.github.io/
      icon: fa-solid fa-globe
    - label: Code
      url: https://github.com/agentdeepsynthesis/deepsynth-bench
      icon: fa-brands fa-github
    - label: Dataset
      url: https://huggingface.co/datasets/DeepSynthesisTeam/deepsynth-bench
      icon: fa-solid fa-database
    - label: Leaderboard
      url: https://huggingface.co/spaces/DeepSynthesisTeam/deepsynth-leaderboard
      icon: fa-solid fa-trophy
  papers:
    - label: Paper
      arxiv: 2602.21143

- title: Formal Mathematical Reasoning
  description: Bridging natural language mathematics and machine-verifiable proofs through autoformalisation.
  links:
    - label: Website
      url: https://formal-math-reasoning.github.io/
      icon: fa-solid fa-globe
    - label: GitHub
      url: https://github.com/Formal-Math-Reasoning
      icon: fa-brands fa-github
  # subprojects render as subcards inside this card, which then spans the full grid width
  subprojects:
    - title: DRIFT
      venue: ICLR 2026
      description: Decompose, Retrieve, Illustrate, then Formalize Theorems, retrieving premises for sub-components of informal statements.
      papers:
        - label: Paper
          arxiv: 2510.10815
    - title: TopoAlign
      venue: EMNLP 2026
      description: Aligning code to math via topological decomposition, unlocking code repositories as training data for Math LLMs.
      papers:
        - label: Paper
          arxiv: 2510.11944
    - title: Conjecturing
      venue: arXiv 2025
      description: ConjectureBench and Lean-FIRe, treating conjecturing as a distinct step of formal mathematical reasoning.
      papers:
        - label: Paper
          arxiv: 2510.11986
    - title: LeanFlow
      description: A Python interface for Lean 4.
      links:
        - label: Code
          url: https://github.com/Formal-Math-Reasoning/leanflow
          icon: fa-brands fa-github

