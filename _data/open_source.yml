# Projects listed on the "open source code" page (_pages/open-source.md), newest first.
# Each project: title, venue, description, links (label/url/icon) and papers (label/arxiv).
# A project may also have subprojects (same fields), shown as subcards. A subproject's optional
# `columns: N` lays its links out in an aligned N-column grid (single column on phones).
# Optional: `tags` (list of topic chips); `featured: <label>` highlights the card, showing <label> above the title;
# `logo: <file>` shows an image from assets/logos/ beside the title (square; corners are rounded by the page).
# (Kept outside assets/img/ so the responsive-image plugin doesn't generate oversized WebP copies.)
# Link buttons are tinted automatically by destination (GitHub, Hugging Face, arXiv, other).
# Icons: fa-solid fa-globe (website), fa-brands fa-github (code), fa-solid fa-database (dataset),
#        fa-solid fa-trophy (leaderboard), fa-solid fa-toolbox (tool), fa-solid fa-cube (model)

- title: Chelis
  logo: chelis.png # from chelis.ch (apple-touch-icon)
  featured: Current project
  tags: [formal verification, programming languages, AI agents]
  description: The verified tensor language for agent-written code.
  links:
    - label: Website
      url: https://chelis.ch/
      icon: fa-solid fa-globe
    - label: Code
      url: https://github.com/Chelis-Lang/chelis
      icon: fa-brands fa-github

- title: DeepSynth
  logo: deepsynth.png # from the DeepSynth project site
  venue: ICLR 2026
